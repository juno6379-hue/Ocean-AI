version: '3.8'

services:
  db:
    image: postgres:15
    container_name: ocean_ai_postgres
    restart: always
    environment:
      POSTGRES_USER: ocean_ai_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your local environment}
      POSTGRES_DB: ocean_ai_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
